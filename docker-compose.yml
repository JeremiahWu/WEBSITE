services:
  mysql:
    image: mysql:8
    container_name: labsoft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: labsoft_root
      MYSQL_DATABASE: labsoft
      MYSQL_USER: labsoft
      MYSQL_PASSWORD: labsoft_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: labsoft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
