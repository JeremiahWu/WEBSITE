# FRPC 配置 —— 运行在私有服务器上
# 作用：把私有服务器上的 CORE 后端 API 通过云服务器 frps 透出到公网
# 部署位置：私有服务器（与 CORE 同机），网站本身跑在云服务器上，不走 FRP

serverAddr = "cloud-server-ip-or-domain"  # 替换为云服务器地址
serverPort = 7000                          # frps 端口
auth.method = "token"
auth.token = "fill-with-frps-token"        # 与云服务器 .env 中 FRPS_AUTH_TOKEN 一致

# 后端 API 反向代理（api.laowu.cafe -> CORE）
[[proxies]]
name = "api-http"
type = "http"
localIP = "127.0.0.1"
localPort = 8080                           # CORE 后端端口
customDomains = ["api.laowu.cafe"]
